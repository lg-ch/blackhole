apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mangrove.fullname" . }}
  labels:
    {{- include "mangrove.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mangrove.fullname" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mangrove.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mangrove.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "{{ .Values.service.port }}"
        prometheus.io/path:   "/metrics"
    spec:
      terminationGracePeriodSeconds: 60   # let SIGTERM freeze pending
      containers:
        - name: mangrove
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "/opt/mangrove/scripts/serve_cluster.py"]
          args:
            - --root
            - /data
            - --port
            - "{{ .Values.service.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            {{- if .Values.auth.enabled }}
            - name: MG_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret -}}
                            {{ .Values.auth.existingSecret }}
                        {{- else -}}
                            {{ include "mangrove.fullname" . }}-auth
                        {{- end }}
                  key: keys
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
