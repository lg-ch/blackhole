[build-system]
requires      = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "mangrove-search"
version         = "0.1.0"
description     = "Cold-storage massive multi-index ANN vector search"
readme          = "README.md"
license         = { file = "LICENSE" }
requires-python = ">=3.10"
keywords        = ["ann", "vector-search", "rag", "embeddings", "knn", "search"]
authors         = [{ name = "Leo Chartier", email = "chartier.lg@gmail.com" }]
classifiers     = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21",
    "urllib3>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]
dev = [
    "pytest>=7",
    "mypy>=1",
    "ruff>=0.1",
]

[project.urls]
Homepage      = "https://gitlab.com/leo_chartier/mangrove-search"
Documentation = "https://gitlab.com/leo_chartier/mangrove-search/-/blob/master/README.md"
Repository    = "https://gitlab.com/leo_chartier/mangrove-search"
Issues        = "https://gitlab.com/leo_chartier/mangrove-search/-/issues"

# Package the `mangrove` namespace from scripts/mangrove/ — that's where the
# SDK lives in source. setuptools is told to look there explicitly.
[tool.setuptools]
package-dir = { "mangrove" = "scripts/mangrove" }

[tool.setuptools.packages.find]
where    = ["scripts"]
include  = ["mangrove*"]

[tool.setuptools.package-data]
mangrove = ["py.typed"]
